<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebFlow OS v0.26 — Webfluence Command Web</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface2:#f2f3f6;--border:#e5e7ec;
  --text:#16181d;--muted:#6b7280;--brand:#f5b50c;--brand-text:#a9760a;
  --success:#15a06a;--warning:#b9770f;--danger:#d83a3a;--info:#2f74d0;
  --radius:10px;--sidebar:230px;--header:54px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--brand-text);text-decoration:none}
button{cursor:pointer;font-family:inherit;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px}

/* ─── Layout ─── */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--header) 1fr;height:100vh;overflow:hidden}
#topbar{grid-column:1/-1;grid-row:1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:100}
#topbar .logo{font-weight:700;font-size:16px;letter-spacing:-.3px;color:var(--text)}
#topbar .logo span{color:var(--brand-text)}
#topbar .version{font-size:11px;color:var(--muted);margin-left:2px}
#topbar .spacer{flex:1}
#ai-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#ai-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.user-pill{background:var(--brand);color:#0a0a0c;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}

#sidebar{grid-column:1;grid-row:2;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
.nav-group{margin-bottom:4px}
.nav-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;padding:8px 18px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;transition:all .15s;font-size:13px}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(245,181,12,.1) 0%,transparent 100%);border-left-color:var(--brand);color:var(--brand-text);font-weight:600}
.nav-icon{width:16px;text-align:center;flex-shrink:0}

#view{grid-column:2;grid-row:2;overflow-y:auto;padding:22px 24px}

/* ─── Cards & Stats ─── */
.page-title{font-size:20px;font-weight:700;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:22px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .val{font-size:22px;font-weight:700;color:var(--text)}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stat-card .val.green{color:var(--success)}
.stat-card .val.amber{color:var(--warning)}
.stat-card .val.red{color:var(--danger)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card-title{font-weight:600;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .ct-badge{font-size:11px;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:1px 8px}

/* ─── Tables ─── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:7px 12px;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* ─── Tags & Badges ─── */
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.tag-green{background:rgba(21,160,106,.12);color:var(--success)}
.tag-amber{background:rgba(185,119,15,.12);color:var(--warning)}
.tag-red{background:rgba(216,58,58,.12);color:var(--danger)}
.tag-blue{background:rgba(47,116,208,.12);color:var(--info)}
.tag-muted{background:var(--surface2);color:var(--muted)}
.tag-brand{background:rgba(245,181,12,.18);color:var(--brand-text)}

/* ─── Buttons ─── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-brand{background:var(--brand);border-color:var(--brand);color:#0a0a0c;font-weight:600}
.btn-brand:hover{background:#e0a40b}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:rgba(216,58,58,.08);border-color:rgba(216,58,58,.3);color:var(--danger)}
.btn-success{background:rgba(21,160,106,.08);border-color:rgba(21,160,106,.3);color:var(--success)}

/* ─── Health bar ─── */
.health-bar{display:flex;align-items:center;gap:8px}
.hb-track{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.hb-fill{height:100%;border-radius:3px}

/* ─── SVG Bar Chart ─── */
.bar-chart{width:100%;overflow:visible}

/* ─── Kanban ─── */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kanban-col{background:var(--surface2);border-radius:var(--radius);padding:10px}
.kanban-col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kanban-card .kc-title{font-size:13px;font-weight:600;margin-bottom:4px}
.kanban-card .kc-meta{font-size:11px;color:var(--muted)}

/* ─── Calendar ─── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-hdr{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-day{min-height:76px;background:var(--surface2);border-radius:6px;padding:4px;position:relative}
.cal-day.today{background:rgba(245,181,12,.12);border:1px solid var(--brand)}
.cal-day.other-month{opacity:.4}
.cal-day .day-num{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.cal-post{border-radius:4px;padding:2px 5px;font-size:10px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-post.meta{background:rgba(47,116,208,.15);color:var(--info)}
.cal-post.ig{background:rgba(185,119,15,.15);color:var(--warning)}
.cal-post.li{background:rgba(21,160,106,.15);color:var(--success)}
.cal-post.yt{background:rgba(216,58,58,.15);color:var(--danger)}

/* ─── Timeline ─── */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;margin-bottom:18px}
.tl-dot{position:absolute;left:-22px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tl-year{font-size:11px;font-weight:700;color:var(--brand-text);margin-bottom:2px}
.tl-text{font-size:13px;color:var(--text)}

/* ─── Modal ─── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal-box{background:var(--surface);border-radius:12px;max-width:660px;width:95%;max-height:88vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.18)}
#modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;padding:2px 6px}
#modal-close:hover{color:var(--text)}

/* ─── Alerts ─── */
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:8px;margin-bottom:8px;font-size:13px}
.alert-danger{background:rgba(216,58,58,.08);border:1px solid rgba(216,58,58,.2);color:#8f1a1a}
.alert-warning{background:rgba(185,119,15,.08);border:1px solid rgba(185,119,15,.2);color:#7a4f00}
.alert-info{background:rgba(47,116,208,.08);border:1px solid rgba(47,116,208,.2);color:#0e3d80}
.alert-success{background:rgba(21,160,106,.08);border:1px solid rgba(21,160,106,.2);color:#0a5a38}

/* ─── Form ─── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field label{font-size:12px;font-weight:600;color:var(--muted)}
.form-field input,.form-field select,.form-field textarea{border:1px solid var(--border);border-radius:6px;padding:7px 10px;background:var(--surface);outline:none;transition:border .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--brand)}
.form-full{grid-column:1/-1}

/* ─── Progress ─── */
.score-ring{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:700}

/* ─── Misc ─── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt-16{margin-top:16px}
.mb-4{margin-bottom:4px}
.mb-8{margin-bottom:8px}
.mb-16{margin-bottom:16px}
.text-muted{color:var(--muted)}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.fw-600{font-weight:600}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.logo-wall{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.logo-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--muted)}

/* Activity feed */
.activity-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:4px}
.activity-time{color:var(--muted);white-space:nowrap}

/* Service cards */
.service-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:box-shadow .15s}
.service-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.service-icon{font-size:20px;margin-bottom:8px}
.service-title{font-weight:700;font-size:14px;margin-bottom:4px;color:var(--text)}
.service-desc{font-size:12px;color:var(--muted)}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}

/* Industry card */
.ind-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.ind-icon{font-size:28px;margin-bottom:8px}
.ind-title{font-weight:700;margin-bottom:4px}
.ind-desc{font-size:12px;color:var(--muted)}
.industries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

/* Toggle */
.toggle-wrap{display:flex;align-items:center;gap:10px;font-size:13px}
.toggle{position:relative;width:38px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--brand)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:var(--header) auto 1fr}
  #sidebar{grid-column:1;grid-row:2;display:flex;flex-wrap:wrap;gap:0;padding:4px 8px;border-right:none;border-bottom:1px solid var(--border);max-height:none}
  #view{grid-row:3}
  .nav-group,.nav-label{display:none}
  .nav-item{padding:5px 10px;border-left:none;border-bottom:2px solid transparent;font-size:12px}
  .nav-item.active{border-bottom-color:var(--brand);background:none}
  .kanban{grid-template-columns:repeat(2,1fr)}
  .two-col,.three-col{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>

//  HELPERS
// ═══════════════════════════════════════════════════════
function fmt(n){return new Intl.NumberFormat('en-IN').format(Math.round(n))}
function fmtC(n){return '₹'+fmt(n)}
function pct(n){return n.toFixed(1)+'%'}
function x(n){return n.toFixed(2)+'x'}
function health2color(h){return h>=85?'var(--success)':h>=70?'var(--warning)':'var(--danger)'}
function channelTag(ch){const m={META:'tag-blue',GOOGLE:'tag-green',LINKEDIN:'tag-brand',YOUTUBE:'tag-red'};return `<span class="tag ${m[ch]||'tag-muted'}">${ch}</span>`}
function statusTag(s){const m={PAID:'tag-green',OVERDUE:'tag-red',PENDING:'tag-amber'};return `<span class="tag ${m[s]||'tag-muted'}">${s}</span>`}
function lifecycleTag(l){const m={SQL:'tag-green',MQL:'tag-blue',LEAD:'tag-muted'};return `<span class="tag ${m[l]||'tag-muted'}">${l||'NEW'}</span>`}
function budgetMid(b){const m={'Under ₹1L':80000,'₹1L – ₹5L':250000,'₹5L – ₹20L':1000000,'₹20L+':2500000};return m[b]||100000}

function cMetrics(c){
  const roas=c.revenue/c.spend;
  const ctr=c.clicks/c.impressions*100;
  const cpc=c.spend/c.clicks;
  const cpl=c.spend/c.leads;
  const cpa=c.spend/c.conversions;
  const overspend=c.spend>c.budget;
  return {roas,ctr,cpc,cpl,cpa,overspend};
}

function mrr(){return state.clients.reduce((s,c)=>s+c.retainer,0)}
function todayStr(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function addActivity(text,type='ops'){
  const now=new Date();
  const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  state.activity.unshift({time:t,text,type});
  if(state.activity.length>30)state.activity.pop();
}

// ═══════════════════════════════════════════════════════
//  W1 — CAPTURE & SCORE LEAD
// ═══════════════════════════════════════════════════════
function W1_scoreLead(lead){
  let score=30;
  // Source weight
  if(lead.source==='Referral')score+=20;
  else if(lead.source==='Inbound Website')score+=12;
  else if(lead.source==='LinkedIn')score+=8;
  // Budget weight
  if(lead.budget==='₹20L+')score+=25;
  else if(lead.budget==='₹5L – ₹20L')score+=15;
  else if(lead.budget==='₹1L – ₹5L')score+=8;
  // Core sector
  const hotSectors=['Real Estate','Fintech','B2B & SaaS'];
  if(hotSectors.includes(lead.sector))score+=10;
  // End-to-end scope
  if(lead.service==='End-to-end Marketing')score+=10;
  else if(lead.service.includes('Performance'))score+=5;
  score=Math.min(100,score);
  const lifecycle=score>=75?'SQL':score>=50?'MQL':'LEAD';
  const disciplineMap={'Performance Marketing (Google & Meta)':'PM','SEO & Content':'CW','Brand & Creative':'CR','Web & Landing Pages':'WB','Social Media':'CW','End-to-end Marketing':'ST'};
  const discCode=disciplineMap[lead.service]||'ST';
  const op=state.team.find(t=>t.code===discCode)||state.team[0];
  return {score,lifecycle,owner:op.name};
}

function W1_captureLead(formData){
  const lead={
    id:'l'+Date.now(),
    name:formData.name,company:formData.company,
    sector:formData.sector,service:formData.service,budget:formData.budget,
    source:formData.source||'Inbound Website',
    score:0,lifecycle:'',owner:'',
    createdAt:new Date(),lastActivity:new Date(),
    stage:'Discovery',notes:formData.notes||''
  };
  const scored=W1_scoreLead(lead);
  lead.score=scored.score;lead.lifecycle=scored.lifecycle;lead.owner=scored.owner;
  state.leads.unshift(lead);
  addActivity(`New lead captured — ${lead.name} (${lead.company}) | Score: ${lead.score} | ${lead.lifecycle}`,'lead');
  if(lead.score>=50){
    state.deals.push({id:'d'+lead.id,leadId:lead.id,name:lead.company,value:budgetMid(lead.budget),stage:'Discovery',score:lead.score,contact:lead.name});
    addActivity(`Deal auto-created for ${lead.company} (score ${lead.score})`,'lead');
  }
  return lead;
}

// ═══════════════════════════════════════════════════════
//  W3 — SYNC CAMPAIGNS (simulate 1 day)
// ═══════════════════════════════════════════════════════
function W3_syncCampaigns(){
  state.campaigns.forEach(c=>{
    const dailyBudget=c.budget/30;
    const variance=(Math.random()-.4)*.15;
    const dailySpend=dailyBudget*(1+variance);
    c.spend=Math.round(c.spend+dailySpend);
    const ctr=(c.clicks/c.impressions)*(1+(Math.random()-.5)*.1);
    const newImpr=Math.round(c.impressions*0.035);
    const newClicks=Math.round(newImpr*ctr);
    const convRate=c.conversions/c.clicks;
    const newConv=Math.round(newClicks*convRate*(1+(Math.random()-.5)*.2));
    c.impressions+=newImpr;c.clicks+=newClicks;c.conversions+=newConv;
    c.leads+=Math.round(newClicks*.032);
    c.revenue=Math.round(c.revenue+newConv*(c.revenue/c.conversions||5000));
  });
  addActivity('W3 sync complete — campaign metrics updated with simulated daily delivery','campaign');
}

// ═══════════════════════════════════════════════════════
//  W4 — GENERATE REPORT
// ═══════════════════════════════════════════════════════
function W4_generateReport(clientId){
  const client=state.clients.find(c=>c.id===clientId);
  if(!client)return;
  const camps=state.campaigns.filter(c=>c.client===clientId);
  const totalSpend=camps.reduce((s,c)=>s+c.spend,0);
  const totalLeads=camps.reduce((s,c)=>s+c.leads,0);
  const totalConv=camps.reduce((s,c)=>s+c.conversions,0);
  const totalRev=camps.reduce((s,c)=>s+c.revenue,0);
  const avgROAS=totalSpend>0?totalRev/totalSpend:0;
  const avgCPL=totalLeads>0?totalSpend/totalLeads:0;

  let summary='';
  if(aiMode==='heuristic'){
    const roasVerdict=avgROAS>=4?'strong performance':'room for improvement';
    const trend=client.health>=85?'positive trajectory':'watch-list';
    summary=`${client.name} is showing ${roasVerdict} with a blended ROAS of ${avgROAS.toFixed(1)}x across ${camps.length} active campaign${camps.length!==1?'s':''}. Total spend this period: ${fmtC(totalSpend)}, generating ${fmt(totalLeads)} leads and ${fmt(totalConv)} conversions. Account health score is ${client.health}/100 (${trend}). CPL stands at ${fmtC(avgCPL)}. Recommended actions: ${avgROAS<3?'reallocate budget from underperforming ad sets; test new creatives urgently.':'maintain current bid strategy; explore scaling top-performing ad sets by 15–20%.'}`;
  } else {
    summary='[Claude API would generate a detailed narrative here — configure ANTHROPIC_API_KEY to enable.]';
  }

  const report={clientId,clientName:client.name,generatedAt:new Date().toISOString(),totalSpend,totalLeads,totalConv,avgROAS,avgCPL,summary,health:client.health,retainer:client.retainer};
  state.generatedReports[clientId]=report;
  addActivity(`W4 report generated for ${client.name}`,'ops');
  return report;
}

// ═══════════════════════════════════════════════════════
//  W5 — ANOMALY SCAN
// ═══════════════════════════════════════════════════════
function W5_checkAnomalies(){
  const alerts=[];
  state.campaigns.forEach(c=>{
    const m=cMetrics(c);
    if(m.overspend) alerts.push({type:'danger',msg:`<strong>${c.clientName} — ${c.name}</strong>: Overspend detected. Spent ${fmtC(c.spend)} vs budget ${fmtC(c.budget)} (+${fmtC(c.spend-c.budget)}).`});
    if(m.roas<1.5) alerts.push({type:'danger',msg:`<strong>${c.clientName} — ${c.name}</strong>: ROAS ${m.roas.toFixed(2)}x is below 1.5x threshold.`});
  });
  state.invoices.filter(i=>i.status==='OVERDUE').forEach(i=>{
    alerts.push({type:'danger',msg:`<strong>Overdue Invoice ${i.id}</strong>: ${i.client} — ${fmtC(i.amount)} was due ${i.due}.`});
  });
  const threeDaysAgo=Date.now()-3*86400000;
  state.leads.filter(l=>l.score>=70&&l.lastActivity<new Date(threeDaysAgo)).forEach(l=>{
    alerts.push({type:'warning',msg:`<strong>Hot Lead Idle</strong>: ${l.name} (${l.company}) scored ${l.score} but no activity for 3+ days.`});
  });
  if(alerts.length===0) alerts.push({type:'success',msg:'No anomalies detected — all campaigns and invoices look healthy.'});
  addActivity(`W5 anomaly scan complete — ${alerts.filter(a=>a.type!=='success').length} issue(s) flagged`,'alert');
  return alerts;
}

  const stageOrder=['Discovery','Proposal','Negotiation','Closed Won','Closed Lost'];
  const kanbanCols=stageOrder.slice(0,4).map(stage=>{
    const deals=state.deals.filter(d=>d.stage===stage);
    return `<div class="kanban-col">
      <div class="kanban-col-title">${stage} <span class="ct-badge" style="font-size:10px">${deals.length}</span></div>
      ${deals.map(d=>`<div class="kanban-card" onclick="advanceDeal('${d.id}')">
        <div class="kc-title">${d.name}</div>
        <div class="kc-meta">${d.contact} · ${fmtC(d.value)}</div>
        <div style="margin-top:4px">${scoreBadge(d.score)}</div>
      </div>`).join('')||`<div style="text-align:center;color:var(--muted);font-size:12px;padding:12px 0">Empty</div>`}
    </div>`;
  }).join('');

  const leadsTable=state.leads.map(l=>`<tr>
    <td><div class="fw-600">${l.name}</div><div class="text-xs text-muted">${l.company}</div></td>
    <td>${l.sector}</td>
    <td>${l.budget}</td>
    <td>${l.source}</td>
    <td>${scoreBadge(l.score)}</td>
    <td>${lifecycleTag(l.lifecycle)}</td>
    <td class="text-xs">${l.owner}</td>
    <td>${l.stage}</td>
  </tr>`).join('');

  return `
<div class="page-title">🎯 Leads & Pipeline</div>
<div class="page-sub">AI-scored inbound enquiries + deal kanban</div>

<div class="card mb-16">
  <div class="card-title">📬 Capture New Enquiry <span class="ct-badge">W1</span></div>
  ${leadCaptureForm('leads')}
</div>

<div class="card mb-16">
  <div class="card-title">🗂️ Deal Kanban</div>
  <div class="kanban">${kanbanCols}</div>
  <div class="text-xs text-muted mt-16">Click a deal card to advance its stage.</div>
</div>

<div class="card">
  <div class="card-title">📋 Inbound Enquiries</div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Name</th><th>Sector</th><th>Budget</th><th>Source</th><th>Score</th><th>Lifecycle</th><th>Owner</th><th>Stage</th></tr></thead>
      <tbody>${leadsTable}</tbody>
    </table>
  </div>
</div>`;
}

function scoreBadge(score){
  const col=score>=75?'var(--success)':score>=50?'var(--info)':'var(--muted)';
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:${col}18;border:1.5px solid ${col};color:${col};font-size:11px;font-weight:700">${score}</span>`;
}

function advanceDeal(dealId){
  const order=['Discovery','Proposal','Negotiation','Closed Won'];
  const d=state.deals.find(x=>x.id===dealId);
  if(!d)return;
  const i=order.indexOf(d.stage);
  if(i<order.length-1){d.stage=order[i+1];addActivity(`Deal "${d.name}" advanced to ${d.stage}`,'lead');}
  go('leads');
}

function renderCampaigns(){
  const channels=['META','GOOGLE','LINKEDIN'];
  const chanCards=channels.map(ch=>{
    const cList=state.campaigns.filter(c=>c.channel===ch);
    const totalSpend=cList.reduce((s,c)=>s+c.spend,0);
    const totalRev=cList.reduce((s,c)=>s+c.revenue,0);
    const roas=totalSpend>0?totalRev/totalSpend:0;
    const col=roas>=4?'var(--success)':roas>=1.5?'var(--warning)':'var(--danger)';
    return `<div class="card">
      <div class="text-xs text-muted mb-4">${ch} Channel</div>
      <div style="font-size:22px;font-weight:700;color:${col}">${roas.toFixed(2)}x ROAS</div>
      <div class="text-xs text-muted">${fmtC(totalSpend)} spend · ${cList.length} campaigns</div>
    </div>`;
  }).join('');

  const rows=state.campaigns.map(c=>{
    const m=cMetrics(c);
    return `<tr>
      <td><div class="fw-600" style="font-size:12px">${c.name}</div><div class="text-xs text-muted">${c.clientName}</div></td>
      <td>${channelTag(c.channel)}</td>
      <td>${fmtC(c.budget)}</td>
      <td style="color:${m.overspend?'var(--danger)':'var(--text)'};font-weight:${m.overspend?700:400}">${fmtC(c.spend)} ${m.overspend?'🔴':''}</td>
      <td>${fmt(c.impressions)}</td>
      <td>${pct(m.ctr)}</td>
      <td>${fmtC(m.cpc)}</td>
      <td>${fmt(c.leads)}</td>
      <td>${fmtC(m.cpl)}</td>
      <td>${fmt(c.conversions)}</td>
      <td><span style="font-weight:700;color:${m.roas>=4?'var(--success)':m.roas<1.5?'var(--danger)':'var(--warning)'}">${x(m.roas)}</span></td>
    </tr>`;
  }).join('');

  return `
<div class="page-title">📈 Performance Ads</div>
<div class="page-sub">8 active campaigns across META / GOOGLE / LINKEDIN</div>
<div class="three-col mb-16">${chanCards}</div>
<div class="card">
  <div class="card-title flex-between">
    <span>Campaign Table</span>
    <button class="btn btn-brand btn-sm" onclick="syncAndRefresh()">🔄 Sync Data (W3)</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Campaign</th><th>Channel</th><th>Budget</th><th>Spend</th><th>Impressions</th><th>CTR</th><th>CPC</th><th>Leads</th><th>CPL</th><th>Conv</th><th>ROAS</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
</div>`;
}

function syncAndRefresh(){
  W3_syncCampaigns();
  go('campaigns');

}

function advanceProject(pid){
  const order=['Backlog','In Progress','Review','Approved'];

  if(i<order.length-1){p.stage=order[i+1];addActivity(`Project "${p.title}" moved to ${p.stage}`,'ops');}
  go('projects');
}

//  TAB: SOCIAL CALENDAR
// ═══════════════════════════════════════════════════════
function renderSocial(){
  const year=2026,month=5; // June 2026 (0-indexed)
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const headers=dayNames.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('');

  let cells='';
  for(let i=0;i<firstDay;i++) cells+=`<div class="cal-day other-month"><div class="day-num">&nbsp;</div></div>`;
  const today=new Date();
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`2026-06-${String(d).padStart(2,'0')}`;
    const isToday=today.getFullYear()===2026&&today.getMonth()===5&&today.getDate()===d;
    const posts=state.socialPosts.filter(p=>p.date===dateStr);
    const postHtml=posts.map(p=>`<div class="cal-post ${p.channel}">${p.channel.toUpperCase()}: ${p.text.slice(0,28)}…</div>`).join('');
    cells+=`<div class="cal-day ${isToday?'today':''}"><div class="day-num">${d}</div>${postHtml}</div>`;
  }

  const schedTable=state.socialPosts.map(p=>`<tr>
    <td>${p.date}</td>
    <td><span class="tag ${p.channel==='meta'?'tag-blue':p.channel==='ig'?'tag-amber':p.channel==='li'?'tag-green':'tag-red'}">${p.channel.toUpperCase()}</span></td>
    <td>${p.text}</td>
  </tr>`).join('');

  return `
<div class="page-title">📅 Social Calendar</div>
<div class="page-sub">June 2026 — 13 scheduled posts across 4 channels</div>
<div class="card">
  <div class="cal-grid">${headers}${cells}</div>
  <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
    <span class="cal-post meta" style="font-size:11px">META</span>
    <span class="cal-post ig" style="font-size:11px">INSTAGRAM</span>
    <span class="cal-post li" style="font-size:11px">LINKEDIN</span>
    <span class="cal-post yt" style="font-size:11px">YOUTUBE</span>
  </div>
</div>
<div class="card mt-16">
  <div class="card-title">📋 Post Schedule</div>
  <div class="tbl-wrap">
    <table><thead><tr><th>Date</th><th>Channel</th><th>Content</th></tr></thead><tbody>${schedTable}</tbody></table>
  </div>
</div>`;
}

function renderFinance(){
  const totalMRR=mrr();
  const collected=state.invoices.filter(i=>i.status==='PAID').reduce((s,i)=>s+i.amount,0);
  const outstanding=state.invoices.filter(i=>i.status!=='PAID').reduce((s,i)=>s+i.amount,0);
  const expenses=[
    {name:'Salaries (10 operators)',amount:450000},
    {name:'Ad Tools & Ad-serving',amount:48000},
    {name:'Studio & Rent (HSR Layout)',amount:85000},
    {name:'Production & Freelancers',amount:62000}
  ];
  const totalExp=expenses.reduce((s,e)=>s+e.amount,0);
  const profit=totalMRR-totalExp;

  const invRows=state.invoices.map(i=>`<tr>
    <td class="fw-600">${i.id}</td>
    <td>${i.client}</td>
    <td>${fmtC(i.amount)}</td>
    <td>${i.due}</td>
    <td>${statusTag(i.status)}</td>
  </tr>`).join('');

  const maxBar=Math.max(totalMRR,totalExp);
  const mrrW=(totalMRR/maxBar*100).toFixed(1);
  const expW=(totalExp/maxBar*100).toFixed(1);

  const expRows=expenses.map(e=>`
    <div style="margin-bottom:10px">
      <div class="flex-between text-sm mb-4"><span>${e.name}</span><span class="fw-600">${fmtC(e.amount)}</span></div>
      <div style="height:5px;background:var(--surface2);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${(e.amount/totalExp*100).toFixed(0)}%;background:var(--brand);border-radius:3px"></div>
      </div>
    </div>`).join('');

  return `
<div class="page-title">💰 Finance</div>
<div class="page-sub">MRR, collections, expenses and P&L — ${todayStr()}</div>
<div class="stat-grid mb-16">
  <div class="stat-card"><div class="label">MRR</div><div class="val green">${fmtC(totalMRR)}</div><div class="sub">6 retainers</div></div>
  <div class="stat-card"><div class="label">Collected</div><div class="val green">${fmtC(collected)}</div><div class="sub">This month</div></div>
  <div class="stat-card"><div class="label">Outstanding</div><div class="val amber">${fmtC(outstanding)}</div><div class="sub">${state.invoices.filter(i=>i.status!=='PAID').length} invoices</div></div>
  <div class="stat-card"><div class="label">Total Expenses</div><div class="val">${fmtC(totalExp)}</div><div class="sub">Monthly</div></div>
  <div class="stat-card"><div class="label">Net Profit</div><div class="val ${profit>0?'green':'red'}">${fmtC(profit)}</div><div class="sub">Margin ${((profit/totalMRR)*100).toFixed(0)}%</div></div>
</div>

<div class="two-col">
  <div class="card">
    <div class="card-title">🧾 Invoices</div>
    <div class="tbl-wrap">
      <table><thead><tr><th>Invoice</th><th>Client</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead>
      <tbody>${invRows}</tbody></table>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📊 MRR vs Expenses</div>
    <div style="margin-bottom:14px">
      <div class="flex-between text-sm mb-4"><span>MRR</span><span class="fw-600 text-muted" style="color:var(--success)">${fmtC(totalMRR)}</span></div>
      <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden"><div style="height:100%;width:${mrrW}%;background:var(--success);border-radius:4px"></div></div>
    </div>
    <div style="margin-bottom:20px">
      <div class="flex-between text-sm mb-4"><span>Expenses</span><span class="fw-600" style="color:var(--danger)">${fmtC(totalExp)}</span></div>
      <div style="height:8px;background:var(--surface2);border-radius:4px;overflow:hidden"><div style="height:100%;width:${expW}%;background:var(--danger);border-radius:4px"></div></div>
    </div>
    <div class="card-title">Expense Breakdown</div>
    ${expRows}
  </div>
</div>`;
}

function renameOp(opId){
  const op=state.team.find(t=>t.id===opId);
  if(!op)return;
  const newName=prompt(`Rename operator (current: ${op.name}):`,op.name);
  if(newName&&newName.trim()&&newName!==op.name){
    op.name=newName.trim();
    addActivity(`Operator renamed to ${op.name}`,'ops');
    go('team');
  }
}

function runCrossClientSummary(){
  const totalMRR=mrr();
  const totalSpend=state.campaigns.reduce((s,c)=>s+c.spend,0);
  const totalRev=state.campaigns.reduce((s,c)=>s+c.revenue,0);
  const totalLeads=state.campaigns.reduce((s,c)=>s+c.leads,0);
  const avgROAS=(totalRev/totalSpend).toFixed(2);
  const avgHealth=(state.clients.reduce((s,c)=>s+c.health,0)/state.clients.length).toFixed(0);
  openModal(`
    <h2 style="margin-bottom:12px">🌐 Cross-Client Agency Summary</h2>
    <div class="stat-grid mb-16">
      <div class="stat-card"><div class="label">MRR</div><div class="val green">${fmtC(totalMRR)}</div></div>
      <div class="stat-card"><div class="label">Blended ROAS</div><div class="val">${avgROAS}x</div></div>
      <div class="stat-card"><div class="label">Total Leads</div><div class="val">${fmt(totalLeads)}</div></div>
      <div class="stat-card"><div class="label">Avg Health</div><div class="val">${avgHealth}/100</div></div>
    </div>
    <div style="background:var(--surface2);border-radius:8px;padding:14px;font-size:13px;line-height:1.65;border:1px solid var(--border)">
      Webfluence is managing ${state.clients.length} active retainers with a combined MRR of ${fmtC(totalMRR)}. Blended ROAS across all campaigns stands at ${avgROAS}x against a target of 4.8x. Average account health is ${avgHealth}/100. ${state.campaigns.find(c=>cMetrics(c).overspend)?'⚠️ One campaign is currently overspent — immediate bid review recommended.':''} ${state.invoices.find(i=>i.status==='OVERDUE')?'🚨 One invoice is overdue — follow up with the collections process.':'All invoices are on track.'}
    </div>
    <div style="margin-top:16px;text-align:right"><button class="btn btn-brand" onclick="closeModal()">Close</button></div>
  `);
  addActivity('Cross-client summary generated','ops');
}

function runLeadScorer(){
  state.leads.forEach(l=>{const s=W1_scoreLead(l);l.score=s.score;l.lifecycle=s.lifecycle;l.owner=s.owner;});
  addActivity('Lead scorer re-run — all enquiries rescored','lead');
  openModal(`<h2 style="margin-bottom:12px">🎯 Lead Scorer</h2><p>${state.leads.length} leads rescored. ${state.leads.filter(l=>l.score>=75).length} SQL, ${state.leads.filter(l=>l.score>=50&&l.score<75).length} MQL, ${state.leads.filter(l=>l.score<50).length} LEAD.</p><br><button class="btn btn-brand" onclick="closeModal()">Done</button>`);
}

function runDelayPrediction(){
  const today=new Date();
  const atRisk=state.projects.filter(p=>{
    const due=new Date(p.due);
    const daysLeft=(due-today)/86400000;
    return daysLeft<5&&p.stage!=='Approved';
  });
  const html=atRisk.length>0?atRisk.map(p=>`<div class="alert alert-warning">⏱️ <strong>${p.title}</strong> — due ${p.due} · currently in ${p.stage}</div>`).join(''):`<div class="alert alert-success">✅ No projects at immediate risk of delay.</div>`;
  openModal(`<h2 style="margin-bottom:12px">⏱️ Delay Prediction</h2>${html}<div style="margin-top:16px;text-align:right"><button class="btn btn-brand" onclick="closeModal()">Close</button></div>`);
  addActivity('Delay prediction scan complete','ops');
}

function openMeetingNotes(){
  openModal(`
    <h2 style="margin-bottom:12px">📝 Meeting Notes Extractor</h2>
    <div class="form-field mb-16"><label>Paste call transcript</label><textarea id="notes-input" style="width:100%;height:120px;border:1px solid var(--border);border-radius:6px;padding:8px;resize:vertical"></textarea></div>
    <button class="btn btn-brand" onclick="extractNotes()">Extract Action Items</button>
  `);
}
function extractNotes(){
  const txt=document.getElementById('notes-input').value;
  if(!txt){return;}
  const lines=txt.split('\n').filter(l=>l.length>10).slice(0,5);
  const items=lines.map((l,i)=>`<li style="margin-bottom:4px">Action ${i+1}: ${l.slice(0,80)}…</li>`).join('');
  document.getElementById('modal-content').innerHTML=`<h2 style="margin-bottom:12px">📝 Extracted Action Items</h2><ul style="padding-left:20px;font-size:13px;line-height:1.8">${items||'<li>No clear action items found — try a longer transcript.</li>'}</ul><div style="margin-top:16px;text-align:right"><button class="btn btn-brand" onclick="closeModal()">Done</button></div>`;
  addActivity('Meeting notes processed and action items extracted','ops');
}

function runAnomalyScan(){
  const alerts=W5_checkAnomalies();
  const html=alerts.map(a=>`<div class="alert alert-${a.type}">${a.type==='danger'?'🚨':a.type==='warning'?'⚠️':'✅'} ${a.msg}</div>`).join('');
  openModal(`<h2 style="margin-bottom:12px">🚨 W5 Anomaly Scan Results</h2>${html}<div style="margin-top:16px;text-align:right"><button class="btn btn-brand" onclick="closeModal()">Close</button></div>`);
}

function leadCaptureForm(context){
  const sectors=['Real Estate','Healthcare','Fintech','Travel & Hospitality','B2B & SaaS','Food & D2C','EdTech','E-Commerce'];
  const services=['Performance Marketing (Google & Meta)','SEO & Content','Brand & Creative','Web & Landing Pages','Social Media','End-to-end Marketing'];
  const budgets=['Under ₹1L','₹1L – ₹5L','₹5L – ₹20L','₹20L+'];
  const sources=['Inbound Website','Referral','LinkedIn','Instagram DM','Google Search','Cold Outreach'];

  return `<form onsubmit="submitLead(event,'${context}')">
    <div class="form-grid">
      <div class="form-field"><label>Full Name *</label><input required name="name" placeholder="Rajesh Kumar"></div>
      <div class="form-field"><label>Company *</label><input required name="company" placeholder="Acme Realty"></div>
      <div class="form-field"><label>Sector *</label><select required name="sector"><option value="">Select sector…</option>${sectors.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="form-field"><label>Service Interested In *</label><select required name="service"><option value="">Select service…</option>${services.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="form-field"><label>Monthly Budget *</label><select required name="budget"><option value="">Select budget…</option>${budgets.map(b=>`<option>${b}</option>`).join('')}</select></div>
      <div class="form-field"><label>Source</label><select name="source">${sources.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="form-field form-full"><label>Notes</label><textarea name="notes" rows="2" placeholder="Brief context…"></textarea></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button type="submit" class="btn btn-brand">⚡ Capture Lead (W1)</button>
      <span class="text-xs text-muted">Auto-scored · lifecycle tagged · deal created if score ≥50</span>
    </div>
  </form>`;
}

function submitLead(e,context){
  e.preventDefault();
  const fd=new FormData(e.target);
  const data={name:fd.get('name'),company:fd.get('company'),sector:fd.get('sector'),service:fd.get('service'),budget:fd.get('budget'),source:fd.get('source'),notes:fd.get('notes')};
  const lead=W1_captureLead(data);
  e.target.reset();
  openModal(`
    <h2 style="margin-bottom:12px">⚡ Lead Captured — W1 Complete</h2>
    <div class="stat-grid mb-16">
      <div class="stat-card"><div class="label">AI Score</div><div class="val ${lead.score>=75?'green':lead.score>=50?'':'amber'}">${lead.score}</div></div>
      <div class="stat-card"><div class="label">Lifecycle</div><div class="val" style="font-size:16px">${lead.lifecycle}</div></div>
      <div class="stat-card"><div class="label">Owner</div><div class="val" style="font-size:14px">${lead.owner.split(' ')[0]}</div></div>
    </div>
    <div class="alert ${lead.score>=50?'alert-success':'alert-info'}">${lead.score>=50?'✅ Deal auto-created and added to pipeline.':'ℹ️ Score < 50 — added to leads list. Nurture sequence queued.'}</div>
    <div style="margin-top:16px;text-align:right"><button class="btn btn-brand" onclick="closeModal();go('leads')">View Pipeline</button></div>
  `);
}
