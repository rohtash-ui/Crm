# ============================================================================
# CRM Backup Configuration
# Copy this file and adjust values for your environment.
# All backup scripts source this file for shared settings.
# ============================================================================

# --- General ---
BACKUP_DIR="/backups"
LOG_DIR="/var/log"
ENCRYPT_BACKUPS="true"
LOCAL_RETENTION_DAYS="7"

# --- Database ---
DB_HOST="localhost"
DB_PORT="5432"
DB_USER="replication_user"
DB_NAME="crm_production"
# GPG_RECIPIENT="backup@yourcompany.com"  # For asymmetric encryption (optional)

# --- Application paths ---
UPLOADS_DIR="/data/uploads"
CONFIG_DIR="/app/config"

# --- Sync destinations (comma-separated: gdrive, s3, personal, onedrive) ---
SYNC_DESTINATIONS="gdrive,personal"

# --- Google Drive (via rclone) ---
GDRIVE_REMOTE="gdrive"
GDRIVE_PATH="CRM-Backups"

# --- AWS S3 (via rclone) ---
S3_REMOTE="s3"
S3_BUCKET="crm-backups-bucket"
S3_PREFIX=""    # defaults to $(hostname)
S3_STORAGE_CLASS="STANDARD_IA"

# --- OneDrive (via rclone) ---
ONEDRIVE_REMOTE="onedrive"
ONEDRIVE_PATH="CRM-Backups"

# --- Personal / USB drive ---
PERSONAL_DRIVE_PATH="/mnt/personal-drive"

# --- Health checks (optional: dead-man's switch URLs) ---
HEALTH_CHECK_URL=""
HEALTH_CHECK_FAIL_URL=""

# --- Verification ---
VERIFY_DB="crm_verify_scratch"
